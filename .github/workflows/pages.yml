# Baut die Jekyll-Site und deployt sie nach GitHub Pages.
# In den Repo-Einstellungen muss unter Settings → Pages als Source
# "GitHub Actions" gewählt sein.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # configure-pages schreibt baseurl nur in JS-Configs, nicht in YAML.
      # Deshalb url/baseurl hier aus der tatsächlichen Pages-URL setzen:
      # Root-Site (Repo dh-handbuch.github.io) -> baseurl "", Projekt-Site -> "/public".
      - name: Set url/baseurl from Pages URL
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s#^url:.*#url: \"${PAGES_ORIGIN}\"#; s#^baseurl:.*#baseurl: \"${PAGES_BASE_PATH}\"#" _config.yml
          grep -E '^(url|baseurl):' _config.yml
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
