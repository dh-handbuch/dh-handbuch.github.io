# Baut die Jekyll-Site und deployt sie nach GitHub Pages.
# In den Repo-Einstellungen muss unter Settings → Pages als Source
# "GitHub Actions" gewählt sein.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Versucht, Pages automatisch zu aktivieren, falls noch nicht geschehen
          enablement: true
          # Setzt url/baseurl in _config.yml passend zur Pages-URL
          static_site_generator: jekyll
          generator_config_file: _config.yml
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
